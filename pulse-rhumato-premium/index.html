<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pulse Rhumato Premium</title><meta name="theme-color" content="#0d5f5b"><style>:root{--bg:#f3f6f7;--card:#fff;--text:#162124;--muted:#748187;--line:#e3eaec;--teal:#0d5f5b;--teal2:#15857d;--soft:#e7f5f3;--danger:#a54a4a;--gold:#b58932;--shadow:0 18px 50px rgba(20,39,43,.09)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#e5f4f2 0,transparent 34%),var(--bg);color:var(--text);font-family:Inter,ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{padding:24px 16px;background:linear-gradient(180deg,#102827,#163a38);color:white;position:sticky;top:0;height:100vh}.logo{font-size:24px;font-weight:950;letter-spacing:-.6px;padding:2px 10px 26px}.logo span{color:#72e1d8}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#d9e7e5;border-radius:13px;text-align:left;padding:13px 14px;font-weight:750}.nav button.on,.nav button:hover{background:#ffffff16;color:#fff}.sideFoot{position:absolute;left:16px;right:16px;bottom:18px}.profileMini{padding:12px;border:1px solid #ffffff1f;border-radius:14px;background:#ffffff0d;font-size:13px}.main{padding:28px;max-width:1500px;width:100%;margin:auto}.header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.title{font-size:31px;font-weight:950;letter-spacing:-.8px}.sub{color:var(--muted);margin-top:4px}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:850;cursor:pointer}.primary{background:linear-gradient(135deg,var(--teal),var(--teal2));color:white;box-shadow:0 8px 24px rgba(13,95,91,.22)}.ghost{background:#fff;border:1px solid var(--line);color:#314046}.darkbtn{background:#132b2a;color:white}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:850;background:#eef3f4;color:#55636a}.live{background:#e4f7ef;color:#27684d}.warn{background:#fff3d8;color:#795b14}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:rgba(255,255,255,.92);border:1px solid rgba(226,233,235,.95);border-radius:20px;padding:19px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}.kpi strong{font-size:29px;display:block;letter-spacing:-.5px}.kpi span{font-size:13px;color:var(--muted)}.hero{margin-top:15px;display:grid;grid-template-columns:1.2fr .8fr;gap:15px}.heroMain{background:linear-gradient(135deg,#133d3a,#0b6962 65%,#0f7d74);color:white;position:relative;overflow:hidden}.heroMain:after{content:"";position:absolute;width:210px;height:210px;border-radius:50%;right:-60px;top:-80px;background:#ffffff0d}.heroMain h2{font-size:28px;margin:16px 0 8px;max-width:620px}.heroMain p{color:#d8e9e7;max-width:650px;line-height:1.55}.progress{height:10px;background:#e8eef0;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,var(--teal),#22a298)}.heroMain .progress{background:#ffffff21}.heroMain .progress>div{background:#fff}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:25px 0 12px}.sectionTitle h3{margin:0;font-size:17px}.reviewGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.reviewChip{padding:13px;border-radius:15px;border:1px solid var(--line);background:#fff}.reviewChip strong{display:block;font-size:21px}.reviewChip span{font-size:12px;color:var(--muted)}.train{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(360px,.88fr);gap:16px}.qcard h2{line-height:1.4;font-size:23px}.options{display:grid;gap:10px;margin:18px 0}.opt{padding:14px;text-align:left;border-radius:14px;border:1px solid var(--line);background:#fff;cursor:pointer;transition:.18s}.opt:hover{transform:translateY(-1px);border-color:#b8d8d5}.opt.sel{border:2px solid var(--teal);background:var(--soft)}.feedback{padding:15px;border-radius:14px;margin-top:14px}.ok{background:#e8f7ef;color:#245c3d}.ko{background:#fcecec;color:#7a3939}.reviewChooser{margin-top:15px;padding:14px;border:1px dashed #cdd9dc;border-radius:14px;background:#fbfdfd}.reviewBtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.reviewBtns button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-weight:800}.reviewBtns button:hover{border-color:var(--teal);color:var(--teal)}.course{position:sticky;top:22px;align-self:start}.course pre{white-space:pre-wrap;font-family:inherit;line-height:1.62}.list{display:grid;gap:10px}.row{display:grid;grid-template-columns:1.35fr .7fr .7fr auto;gap:10px;align-items:center;padding:13px 14px;background:#fff;border:1px solid var(--line);border-radius:14px}.tag{font-size:11px;font-weight:900;border-radius:999px;padding:5px 8px;display:inline-block}.p1{background:#ffe6e6;color:#943f3f}.p2{background:#fff0c8;color:#84601e}.echo{background:#e5f2ff;color:#3e6591}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.filters button{border:1px solid var(--line);background:white;border-radius:999px;padding:8px 11px;font-weight:800}.filters button.on{background:var(--teal);color:white;border-color:var(--teal)}.authBox{max-width:460px;margin:70px auto}.authBox h1{font-size:33px}.field{display:grid;gap:6px;margin:12px 0}.field input{border:1px solid var(--line);border-radius:12px;padding:12px 13px;font:inherit}.tiny{font-size:12px;color:var(--muted)}.notice{padding:13px;border-radius:13px;background:#edf6ff;color:#3b5f7a}.hidden{display:none}@media(max-width:1050px){.app{grid-template-columns:1fr}.side{height:auto;position:static}.nav{display:flex;overflow:auto}.sideFoot{display:none}.main{padding:18px}.grid4{grid-template-columns:1fr 1fr}.hero,.train{grid-template-columns:1fr}.course{position:static}.reviewGrid{grid-template-columns:1fr 1fr}}@media(max-width:580px){.title{font-size:24px}.main{padding:14px}.grid4{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.reviewGrid{grid-template-columns:1fr 1fr}.card{padding:16px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../pulse-rhumato/backend/client.js"></script></head><body><div id="root"></div><script>
const Q=[{id:'arthrite-1',course:'Arthrite récente',source:'https://app.notion.com/3ac7895854fe8134b35bcecbb169a110',q:'PR sous méthotrexate + adalimumab, genou aigu gonflé depuis 18 h, chondrocalcinose. Quelle priorité ?',opts:['Colchicine immédiate','Infiltration cortisonée','Ponction articulaire avant traitement spécifique','IRM avant ponction'],a:2,c:'Une infection doit être exclue malgré une CPPD plausible. La ponction est prioritaire.',lesson:'Une monoarthrite aiguë impose d’exclure infection, cristaux, hémarthrose et traumatisme. Ponctionner tout épanchement aigu inexpliqué.'},{id:'doppler-1',course:'Réglage Doppler COFER',source:'https://app.notion.com/3ac7895854fe8107a2ffd4a7d658b644',q:'Une synovite en mode B n’affiche aucun Doppler. Quelle première correction ?',opts:['Augmenter la PRF','Relâcher la pression puis optimiser les réglages','Augmenter le filtre mural','Élargir fortement la boîte couleur'],a:1,c:'Relâcher la pression puis utiliser PRF basse, filtre bas, gain juste sous le bruit et petite boîte Doppler.',lesson:'Le Doppler recherche des flux lents : PRF et filtre bas, gain juste sous le bruit, petite boîte centrée, pression minimale.'},{id:'poignet-1',course:'REMIS MAIN POIGNET V4',source:'https://app.notion.com/3ac7895854fe813cae9ec625c4117e81',q:'Un tendon du poignet devient hypoéchogène. Quel geste distingue d’abord anisotropie et ténosynovite ?',opts:['Augmenter la PRF','Heel-toe','Compression forte','IRM'],a:1,c:'Le heel-toe modifie l’angle d’incidence ; la disparition de l’hypoéchogénicité évoque une anisotropie.',lesson:'Explorer récessus, compartiments extenseurs, fléchisseurs, canal carpien et nerf médian. Corriger l’anisotropie par heel-toe.'}];
let S=Object.assign({route:'home',idx:0,sel:null,val:false,done:{},reviews:[],excluded:[],filter:'today',xp:0,streak:1},JSON.parse(localStorage.getItem('pulsePremium')||'{}'));function save(){localStorage.setItem('pulsePremium',JSON.stringify(S))}function datePlus(n){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}function td(){let d=new Date();d.setHours(12,0,0,0);return d.toISOString().slice(0,10)}function route(r){S.route=r;S.sel=null;S.val=false;save();render()}function nav(){return [['home','Accueil'],['train','Entraînement'],['spaced','Répétition espacée'],['stats','Statistiques']].map(x=>`<button class="${S.route===x[0]?'on':''}" onclick="route('${x[0]}')">${x[1]}</button>`).join('')}function shell(inner,title){return `<div class="app"><aside class="side"><div class="logo">Pulse <span>Rhumato</span></div><div class="nav">${nav()}</div><div class="sideFoot"><div class="profileMini"><b>Mode connecté</b><br><span id="cloudState">Connexion backend en attente</span></div></div></aside><main class="main"><div class="header"><div><div class="title">${title}</div><div class="sub">Préparation rhumatologie • 107 cours • répétition espacée personnalisée</div></div><div class="actions"><span class="pill live">● Sauvegarde locale active</span><button class="btn darkbtn" onclick="route('auth')">Se connecter</button></div></div>${inner}</main></div>`}function home(){let done=Object.keys(S.done).length,today=S.reviews.filter(r=>r.due===td()&&r.status==='scheduled').length,late=S.reviews.filter(r=>r.due<td()&&r.status==='scheduled').length;return shell(`<div class="grid4"><div class="card kpi"><strong>${done}/727+</strong><span>Questions uniques</span></div><div class="card kpi"><strong>${today}</strong><span>À revoir aujourd’hui</span></div><div class="card kpi"><strong>${late}</strong><span>En retard</span></div><div class="card kpi"><strong>${S.xp}</strong><span>Points de maîtrise</span></div></div><div class="hero"><div class="card heroMain"><span class="pill">Session recommandée</span><h2>Travaille ce qui compte le plus aujourd’hui.</h2><p>Questions difficiles, cours à côté, correction immédiate et choix du prochain intervalle J1/J2/J7/J10.</p><div class="progress"><div style="width:${Math.min(100,done/727*100)}%"></div></div><div style="margin-top:16px"><button class="btn ghost" onclick="route('${today||late?'spaced':'train'}')">Commencer la session</button></div></div><div class="card"><h3>Répétition espacée</h3><div class="reviewGrid"><div class="reviewChip"><strong>${today}</strong><span>Aujourd’hui</span></div><div class="reviewChip"><strong>${late}</strong><span>En retard</span></div><div class="reviewChip"><strong>${S.reviews.filter(r=>r.due>td()&&r.status==='scheduled').length}</strong><span>À venir</span></div><div class="reviewChip"><strong>${S.excluded.length}</strong><span>Ignorées</span></div></div></div></div>`,'Tableau de bord')}function train(){let q=Q[S.idx%Q.length],ok=S.val&&S.sel===q.a;return shell(`<div class="train"><section class="card qcard"><div><span class="tag p1">P1 Stage</span> <span class="pill">QCM</span></div><h2>${q.q}</h2><div class="options">${q.opts.map((o,i)=>`<button class="opt ${S.sel===i?'sel':''}" onclick="pick(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><button class="btn primary" onclick="validateQ()">Valider</button> <button class="btn ghost" onclick="dontknow()">Je ne sais pas</button>${S.val?`<div class="feedback ${ok?'ok':'ko'}"><b>${ok?'Correct':'À revoir'}</b><br>${q.c}</div><div class="reviewChooser"><b>Quand revoir cette question ?</b><div class="reviewBtns"><button onclick="schedule(1)">J1</button><button onclick="schedule(2)">J2</button><button onclick="schedule(7)">J7</button><button onclick="schedule(10)">J10</button><button onclick="excludeQ()">Ne pas revoir</button></div></div>`:''}</section><aside class="card course"><div class="tiny">Cours correspondant</div><h3>${q.course}</h3><pre>${q.lesson}</pre><a href="${q.source}" target="_blank">Ouvrir la fiche Notion ↗</a></aside></div>`,'Entraînement')}function pick(i){if(!S.val){S.sel=i;render()}}function dontknow(){S.sel=-1;validateQ()}function validateQ(){if(S.sel===null)return;let q=Q[S.idx%Q.length],ok=S.sel===q.a;if(!S.done[q.id]){S.done[q.id]={attempts:0,correct:0};S.xp+=ok?20:10}S.done[q.id].attempts++;if(ok)S.done[q.id].correct++;S.val=true;save();render()}function schedule(n){let q=Q[S.idx%Q.length];S.reviews=S.reviews.filter(r=>r.qid!==q.id);S.reviews.push({qid:q.id,course:q.course,due:datePlus(n),stage:'J'+n,status:'scheduled'});S.excluded=S.excluded.filter(x=>x!==q.id);S.idx=(S.idx+1)%Q.length;S.sel=null;S.val=false;save();render();syncCloud(q)}function excludeQ(){let q=Q[S.idx%Q.length];S.reviews=S.reviews.filter(r=>r.qid!==q.id);if(!S.excluded.includes(q.id))S.excluded.push(q.id);S.idx=(S.idx+1)%Q.length;S.sel=null;S.val=false;save();render();syncCloud(q,true)}async function syncCloud(q,excluded=false){try{if(window.PulseCloud?.client){let d=S.done[q.id]||{};await PulseCloud.saveProgress(q.id,{course_id:q.id,course_title:q.course,attempts:d.attempts||0,correct_attempts:d.correct||0,last_answer:S.sel,last_correct:S.sel===q.a,excluded});let r=S.reviews.find(x=>x.qid===q.id);if(r)await PulseCloud.saveReview(q.id,q.id,r.stage,r.due)}}catch(e){console.warn(e)}}function spaced(){let filt=[['today','À revoir aujourd’hui'],['late','En retard'],['future','À venir'],['all','Toutes'],['excluded','Ignorées']];let data=S.filter==='excluded'?S.excluded.map(id=>({qid:id,course:Q.find(q=>q.id===id)?.course||id,due:'—',stage:'Exclue',status:'excluded'})):S.reviews.filter(r=>S.filter==='all'||(S.filter==='today'&&r.due===td())||(S.filter==='late'&&r.due<td())||(S.filter==='future'&&r.due>td()));return shell(`<div class="filters">${filt.map(f=>`<button class="${S.filter===f[0]?'on':''}" onclick="S.filter='${f[0]}';save();render()">${f[1]}</button>`).join('')}</div><div class="list">${data.length?data.map(r=>`<div class="row"><div><b>${r.course}</b></div><div>${r.stage}</div><div>${r.due}</div><div>${r.status==='excluded'?`<button class="btn ghost" onclick="restore('${r.qid}')">Revoir en J2</button>`:`<button class="btn primary" onclick="openReview('${r.qid}')">Réviser</button>`}</div></div>`).join(''):`<div class="card"><b>Aucune question ici.</b><p class="muted">Ta file de répétition espacée est à jour.</p></div>`}</div>`,'Répétition espacée')}function openReview(id){let i=Q.findIndex(q=>q.id===id);if(i>=0)S.idx=i;S.route='train';S.sel=null;S.val=false;save();render()}function restore(id){S.excluded=S.excluded.filter(x=>x!==id);let q=Q.find(x=>x.id===id);S.reviews.push({qid:id,course:q?.course||id,due:datePlus(2),stage:'J2',status:'scheduled'});save();render()}function stats(){let a=Object.values(S.done).reduce((s,x)=>s+x.attempts,0),c=Object.values(S.done).reduce((s,x)=>s+x.correct,0),rate=a?Math.round(c/a*100):0;return shell(`<div class="grid4"><div class="card kpi"><strong>${Object.keys(S.done).length}</strong><span>Questions travaillées</span></div><div class="card kpi"><strong>${rate}%</strong><span>Réussite</span></div><div class="card kpi"><strong>${S.reviews.length}</strong><span>Révisions programmées</span></div><div class="card kpi"><strong>${S.excluded.length}</strong><span>Questions ignorées</span></div></div>`,'Statistiques')}function auth(){return shell(`<div class="authBox card"><span class="pill">Compte Pulse</span><h1>Retrouve ta progression partout.</h1><p class="sub">Connexion e-mail pour synchroniser iPhone, Mac et Safari. Le backend est prêt dans GitHub ; l’activation cloud sera finalisée dès que le projet Supabase est connecté.</p><div class="field"><label>E-mail</label><input id="email" type="email" placeholder="ton@email.fr"></div><div class="field"><label>Mot de passe</label><input id="pwd" type="password" placeholder="••••••••"></div><button class="btn primary" onclick="login()">Se connecter</button> <button class="btn ghost" onclick="signup()">Créer un compte</button><p id="msg" class="tiny"></p></div>`,'Connexion')}async function login(){let m=document.getElementById('msg');try{if(!PulseCloud.init())throw new Error('Backend pas encore provisionné');let r=await PulseCloud.signIn(email.value,pwd.value);if(r.error)throw r.error;m.textContent='Connecté';await loadCloud();route('home')}catch(e){m.textContent=e.message}}async function signup(){let m=document.getElementById('msg');try{if(!PulseCloud.init())throw new Error('Backend pas encore provisionné');let r=await PulseCloud.signUp(email.value,pwd.value);if(r.error)throw r.error;m.textContent='Compte créé. Vérifie ton e-mail si nécessaire.'}catch(e){m.textContent=e.message}}async function loadCloud(){try{let d=await PulseCloud.loadAll();if(!d)return;for(let x of d.questions)S.done[x.question_id]={attempts:x.attempts,correct:x.correct_attempts};S.reviews=d.reviews.map(r=>({qid:r.question_id,course:r.course_id,due:r.due_date,stage:r.stage,status:r.status}));save()}catch(e){console.warn(e)}}function render(){let f={home,train,spaced,stats,auth}[S.route]||home;document.getElementById('root').innerHTML=f();try{PulseCloud.init()}catch{}}render();</script></body></html>
