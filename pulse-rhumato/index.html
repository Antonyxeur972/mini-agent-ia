<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07110f"><title>Pulse Rhumato</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#06100e;--panel:#0c1916;--line:#1d3831;--text:#f5fbf9;--muted:#91aaa3;--a:#49dfc5;--a2:#8cf0df;--ok:#6ee7a8;--bad:#ff8d8d;--warn:#f1c766}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 20% 0,#12362e 0,#07110f 34%,#040807 100%);color:var(--text)}button,input{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{position:sticky;top:0;height:100vh;padding:24px 16px;background:#050c0ae8;backdrop-filter:blur(22px);border-right:1px solid var(--line)}.logo{font-size:25px;font-weight:950;letter-spacing:-.7px}.logo b{color:var(--a)}.cloud{margin:18px 0;padding:12px;border:1px solid var(--line);border-radius:14px;background:#ffffff05}.cloud strong{display:flex;align-items:center;gap:8px;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}.cloud small{display:block;color:var(--muted);margin-top:5px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#cbdcd7;padding:12px;border-radius:12px;text-align:left}.nav button.on,.nav button:hover{background:#17342d;color:#fff}.main{padding:28px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.eyebrow{text-transform:uppercase;letter-spacing:1.7px;color:var(--a);font-size:11px;font-weight:900}.title{font-size:34px;font-weight:950;letter-spacing:-1px;margin-top:5px}.muted{color:var(--muted)}.card{border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,#142c25e6,#081310ed);box-shadow:0 20px 60px #0005;padding:20px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}.metric strong{font-size:30px}.metric span{display:block;color:var(--muted);font-size:13px}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:14px;margin-top:14px}.heroMain{padding:28px;background:linear-gradient(135deg,#184c42,#0b2a24)}.pill{display:inline-flex;border-radius:999px;padding:6px 10px;background:#ffffff0d;border:1px solid #ffffff14;color:#dcece8;font-size:12px;font-weight:800}.btn{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#11231e;color:white;font-weight:850;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--a),#1aa18f);color:#04110d;border:0}.btn.ghost{background:#ffffff06}.progress{height:10px;border-radius:999px;background:#ffffff12;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,var(--a),var(--a2))}.train{display:grid;grid-template-columns:1.08fr .92fr;gap:16px;margin-top:22px}.qtitle{font-size:24px;line-height:1.4}.opts{display:grid;gap:10px;margin:18px 0}.opt{background:#0a1613;color:white;border:1px solid var(--line);padding:14px;border-radius:14px;text-align:left;cursor:pointer}.opt.sel{border-color:var(--a);background:#12362f}.feedback{padding:14px;border-radius:14px;margin-top:12px;border:1px solid var(--line)}.feedback.ok{background:#0f2e20}.feedback.ko{background:#341b1b}.reviewChoice{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.reviewChoice button{padding:10px;border-radius:12px;border:1px solid var(--line);background:#0a1613;color:white;font-weight:800}.course{position:sticky;top:20px;align-self:start;line-height:1.6}.course a{color:var(--a);font-weight:800;text-decoration:none}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px;border:1px solid #ffffff0c;border-radius:14px;background:#ffffff05}.row small{display:block;color:var(--muted);margin-top:3px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filters button{border:1px solid var(--line);background:#0a1613;color:#dbe9e5;padding:9px 12px;border-radius:999px}.filters button.on{background:#173a33;border-color:#2f665b}.hidden{display:none}.authbox input{width:100%;margin:6px 0;padding:12px;border-radius:12px;border:1px solid var(--line);background:#081411;color:white}.actions{display:flex;gap:8px;flex-wrap:wrap}.nextbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}@media(max-width:1000px){.app{grid-template-columns:1fr}.side{height:auto;position:static}.nav{display:flex;overflow:auto}.main{padding:18px}.grid4{grid-template-columns:1fr 1fr}.hero,.train{grid-template-columns:1fr}.course{position:static}}@media(max-width:620px){.title{font-size:27px}.grid4{grid-template-columns:1fr 1fr}.reviewChoice{grid-template-columns:1fr 1fr}.reviewChoice button:last-child{grid-column:1/-1}}</style></head><body><div id="app"></div><script>
const Q=[
{id:'q1',course:'TRUCHETET Marie-Elise — Arthrite récente',link:'https://app.notion.com/3ac7895854fe8134b35bcecbb169a110',tag:'P1 Stage',text:'Patiente de 69 ans, PR sous méthotrexate + adalimumab, genou aigu inflammatoire, chondrocalcinose et épanchement. Quelle est la priorité ?',opts:['Colchicine sans ponction','Infiltration cortisonée','Ponction articulaire avant traitement spécifique','IRM avant ponction'],a:2,why:'La priorité est la ponction articulaire : l’infection doit être exclue malgré une CPPD plausible.',courseText:'Une monoarthrite aiguë impose d’exclure infection, cristaux, hémarthrose et traumatisme. Ponctionner tout épanchement aigu inexpliqué, surtout si monoarthrite ou terrain à risque.'},
{id:'q2',course:'Réglage Doppler COFER',link:'https://app.notion.com/3ac7895854fe8107a2ffd4a7d658b644',tag:'P1 Écho',text:'Une synovite visible en mode B n’affiche aucun signal Doppler. Quelle première optimisation est la plus logique ?',opts:['Augmenter la PRF','Relâcher la pression puis vérifier les réglages','Augmenter le filtre mural','Élargir fortement la boîte couleur'],a:1,why:'Relâcher la pression puis optimiser PRF basse, filtre bas, gain juste sous le bruit et petite boîte Doppler.',courseText:'Pour les flux synoviaux lents : PRF/échelle basse, filtre de paroi bas, gain juste sous le bruit, petite boîte couleur centrée et pression minimale.'},
{id:'q3',course:'REMIS MAIN POIGNET V4',link:'https://app.notion.com/3ac7895854fe813cae9ec625c4117e81',tag:'P1 Écho',text:'Un tendon du poignet devient hypoéchogène selon l’angle de la sonde. Quel geste permet d’abord de distinguer anisotropie et ténosynovite ?',opts:['Augmenter la PRF','Heel-toe de la sonde','Compression forte','IRM immédiate'],a:1,why:'Le heel-toe corrige l’angle d’incidence ; une hypoéchogénicité qui disparaît évoque l’anisotropie.',courseText:'Corriger systématiquement l’anisotropie des tendons par heel-toe avant de conclure à une ténosynovite.'},
{id:'q4',course:'Arthrite récente — biologie',link:'https://app.notion.com/3ac7895854fe8134b35bcecbb169a110',tag:'P1 Stage',text:'Dans une monoarthrite aiguë fébrile, quels examens du liquide synovial sont prioritaires ?',opts:['Cristaux seuls','Cytologie, Gram/examen direct, cultures et cristaux','ANA et complément','IRM avant toute ponction'],a:1,why:'Le liquide doit être analysé pour cellularité, bactériologie/cultures et cristaux ; les cristaux n’excluent pas une infection.',courseText:'Ponctionner tout épanchement aigu inexpliqué et orienter l’analyse vers infection et cristaux.'}
];
let S=Object.assign({route:'dash',idx:0,answers:{},reviews:{},excluded:{},selected:null,validated:false,filter:'today'},JSON.parse(localStorage.getItem('pulseRhumatoV3')||'{}'));
const d0=()=>new Date().toISOString().slice(0,10),plus=n=>{let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
function persist(){localStorage.setItem('pulseRhumatoV3',JSON.stringify(S)); cloudSave().catch(()=>{});}
let sb=null;const CFG={url:'',key:''};function initCloud(){if(CFG.url&&CFG.key&&window.supabase)sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}initCloud();
async function cloudSave(){if(!sb)return;let {data:{session}}=await sb.auth.getSession();if(!session)return;let q=Q[S.idx];let a=S.answers[q.id];if(a)await sb.from('question_progress').upsert({user_id:session.user.id,question_id:q.id,course_title:q.course,attempts:a.attempts,correct_attempts:a.correct,last_answer:a.last,last_correct:a.lastCorrect,is_hard:!!a.hard,excluded:!!S.excluded[q.id],last_seen_at:new Date().toISOString()},{onConflict:'user_id,question_id'});let r=S.reviews[q.id];if(r)await sb.from('review_schedule').upsert({user_id:session.user.id,question_id:q.id,course_id:q.course,stage:r.stage,due_date:r.date,status:'scheduled'},{onConflict:'user_id,question_id'})}
async function syncDown(){if(!sb)return alert('Supabase non configuré.');let {data:{session}}=await sb.auth.getSession();if(!session)return alert('Connecte-toi d’abord.');let [qa,rv]=await Promise.all([sb.from('question_progress').select('*'),sb.from('review_schedule').select('*')]);(qa.data||[]).forEach(x=>S.answers[x.question_id]={attempts:x.attempts,correct:x.correct_attempts,last:x.last_answer,lastCorrect:x.last_correct,hard:x.is_hard});(rv.data||[]).forEach(x=>S.reviews[x.question_id]={stage:x.stage,date:x.due_date});persist();render()}
function nav(r){S.route=r;S.selected=null;S.validated=false;persist();render()}
function stats(){let a=Object.values(S.answers),attempts=a.reduce((n,x)=>n+x.attempts,0),correct=a.reduce((n,x)=>n+x.correct,0),done=a.length,rate=attempts?Math.round(correct/attempts*100):0,today=Object.values(S.reviews).filter(r=>r.date===d0()).length,hard=a.filter(x=>x.hard).length;return{done,rate,today,hard,planned:Object.keys(S.reviews).length}}
function shell(body,title){let n=[['dash','Tableau de bord'],['train','Entraînement'],['reviews','Répétition espacée'],['stats','Statistiques'],['account','Compte & synchro']];return `<div class="app"><aside class="side"><div class="logo">Pulse <b>Rhumato</b></div><div class="cloud"><strong><span class="dot"></span><span>${sb?'Cloud prêt':'Mode local + cloud prêt'}</span></strong><small>GitHub source • Supabase pour la synchro</small></div><div class="nav">${n.map(x=>`<button class="${S.route===x[0]?'on':''}" onclick="nav('${x[0]}')">${x[1]}</button>`).join('')}</div></aside><main class="main"><div class="top"><div><div class="eyebrow">Préparation rhumatologie</div><div class="title">${title}</div></div><span class="pill">107 cours • ≥727 questions</span></div>${body}</main></div>`}
function dash(){let s=stats(),p=Math.min(100,s.done/727*100);return shell(`<div class="grid4"><div class="card metric"><strong>${s.done}</strong><span>Questions uniques / 727+</span></div><div class="card metric"><strong>${s.today}</strong><span>À revoir aujourd’hui</span></div><div class="card metric"><strong>${s.rate}%</strong><span>Réussite</span></div><div class="card metric"><strong>${s.hard}</strong><span>Difficiles</span></div></div><div class="hero"><div class="card heroMain"><span class="pill">FOCUS DU JOUR</span><h2>Une question, une correction, puis une décision de révision.</h2><p class="muted">J1, J2, J7, J10 ou ne pas revoir. La question suivante est indépendante et ne peut plus rester bloquée sur l’état précédent.</p><button class="btn primary" onclick="nav('train')">Continuer la session</button></div><div class="card"><h3>Progression globale</h3><div class="progress"><div style="width:${p}%"></div></div><p class="muted">${s.done}/727+ travaillées</p><div class="row"><div><b>Révisions planifiées</b><small>Toutes échéances</small></div><strong>${s.planned}</strong></div></div></div>`,'Ton cockpit')}
function train(){let q=Q[S.idx],a=S.answers[q.id];return shell(`<div class="train"><section class="card"><div class="actions"><span class="pill">${q.tag}</span><span class="pill">Question ${S.idx+1}/${Q.length}</span></div><h2 class="qtitle">${q.text}</h2><div class="opts">${q.opts.map((o,i)=>`<button class="opt ${S.selected===i?'sel':''}" onclick="pick(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><div class="actions"><button class="btn primary" onclick="validateQ()">Valider</button><button class="btn ghost" onclick="dontKnow()">Je ne sais pas</button><button class="btn ghost" onclick="markHard()">Difficile</button></div>${S.validated?`<div class="feedback ${S.selected===q.a?'ok':'ko'}"><b>${S.selected===q.a?'Correct':'À revoir'}</b><br>${q.why}</div><div><p><b>Quand revoir cette question ?</b></p><div class="reviewChoice">${[1,2,7,10].map(n=>`<button onclick="schedule(${n})">J${n}</button>`).join('')}<button onclick="exclude()">Ne pas revoir</button></div><div class="nextbar"><span class="muted">Choisis une échéance, puis continue.</span><button class="btn primary" onclick="nextQ()">Question suivante →</button></div></div>`:''}</section><aside class="card course"><div class="eyebrow">Cours associé</div><h3>${q.course}</h3><p>${q.courseText}</p><a href="${q.link}" target="_blank">Ouvrir la fiche Notion ↗</a>${a?`<p class="muted">Tentatives : ${a.attempts} • Réussites : ${a.correct}</p>`:''}</aside></div>`,'Entraînement actif')}
function pick(i){if(S.validated)return;S.selected=i;render()}function dontKnow(){S.selected=-1;validateQ()}function markHard(){let q=Q[S.idx],a=S.answers[q.id]||{attempts:0,correct:0};a.hard=true;S.answers[q.id]=a;persist();render()}
function validateQ(){if(S.selected===null)return;let q=Q[S.idx],a=S.answers[q.id]||{attempts:0,correct:0};a.attempts++;if(S.selected===q.a)a.correct++;a.last=S.selected;a.lastCorrect=S.selected===q.a;S.answers[q.id]=a;S.validated=true;persist();render()}
function schedule(n){let q=Q[S.idx];S.reviews[q.id]={stage:'J'+n,date:plus(n)};delete S.excluded[q.id];persist();render()}function exclude(){let q=Q[S.idx];delete S.reviews[q.id];S.excluded[q.id]=true;persist();render()}
function nextQ(){S.idx=(S.idx+1)%Q.length;S.selected=null;S.validated=false;persist();render();window.scrollTo({top:0,behavior:'smooth'})}
function reviews(){let f=S.filter,td=d0(),rows=Q.map(q=>({q,r:S.reviews[q.id],x:S.excluded[q.id]})).filter(o=>f==='excluded'?o.x:f==='all'?o.r||o.x:f==='today'?o.r&&o.r.date===td:f==='late'?o.r&&o.r.date<td:f==='future'?o.r&&o.r.date>td:false);return shell(`<div class="filters">${[['today','À revoir aujourd’hui'],['late','En retard'],['future','À venir'],['all','Toutes'],['excluded','Ne pas revoir']].map(x=>`<button class="${f===x[0]?'on':''}" onclick="S.filter='${x[0]}';persist();render()">${x[1]}</button>`).join('')}</div><div class="list">${rows.length?rows.map(o=>`<div class="row"><div><b>${o.q.course}</b><small>${o.x?'Ne pas revoir':o.r.stage+' • '+o.r.date}</small></div><button class="btn ghost" onclick="openQ('${o.q.id}')">Ouvrir</button></div>`).join(''):'<div class="card muted">Aucune question dans cette vue.</div>'}</div>`,'Répétition espacée')}
function openQ(id){S.idx=Q.findIndex(q=>q.id===id);S.route='train';S.selected=null;S.validated=false;persist();render()}
function statsView(){let s=stats();return shell(`<div class="grid4"><div class="card metric"><strong>${s.done}</strong><span>Questions uniques</span></div><div class="card metric"><strong>${s.rate}%</strong><span>Réussite</span></div><div class="card metric"><strong>${s.hard}</strong><span>Difficiles</span></div><div class="card metric"><strong>${s.planned}</strong><span>Révisions</span></div></div>`,'Statistiques')}
function account(){return shell(`<div class="card authbox"><h3>Connexion Supabase</h3><p class="muted">Une fois le projet Supabase provisionné, l’URL et la clé publique anon seront injectées ici. Tes réponses pourront alors être retrouvées sur Safari, iPhone et Mac.</p><input id="mail" type="email" placeholder="Email"><input id="pwd" type="password" placeholder="Mot de passe"><div class="actions"><button class="btn primary" onclick="signIn()">Se connecter</button><button class="btn" onclick="signUp()">Créer un compte</button><button class="btn" onclick="syncDown()">Récupérer le cloud</button></div></div>`,'Compte & synchro')}
async function signIn(){if(!sb)return alert('Supabase doit encore être connecté/configuré.');let {error}=await sb.auth.signInWithPassword({email:mail.value,password:pwd.value});if(error)alert(error.message);else{await syncDown();alert('Connecté.')}}async function signUp(){if(!sb)return alert('Supabase doit encore être connecté/configuré.');let {error}=await sb.auth.signUp({email:mail.value,password:pwd.value});if(error)alert(error.message);else alert('Compte créé. Vérifie ton email si demandé.')}
function render(){document.getElementById('app').innerHTML=({dash,train,reviews,stats:statsView,account}[S.route]||dash)()}render();
</script></body></html>
