const target=727,totalCourses=107;let st=Object.assign({route:'home',done:0,cov:0,xp:0,streak:1,goal:10,today:0,hist:{},due:[],ignored:[],hard:[],current:'TRUCHETET Marie-Elise Arthrite rcente',sel:null,val:false,reviewFilter:'today'},JSON.parse(localStorage.getItem('pulseRhumatoGitHub')||'{}'));st.due=Array.isArray(st.due)?st.due:[];st.ignored=Array.isArray(st.ignored)?st.ignored:[];function save(){localStorage.setItem('pulseRhumatoGitHub',JSON.stringify(st))}function datePlus(n){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}function today(){let d=new Date();d.setHours(12,0,0,0);return d.toISOString().slice(0,10)}function setRoute(r){st.route=r;st.sel=null;st.val=false;save();render()}function shell(x,t){let nav=[['home','Accueil'],['path','Parcours'],['train','Entraînement'],['reviews','Répétition espacée'],['stats','Statistiques']];return `<div class="shell"><aside class="side"><div class="brand">Pulse <b>Rhumato</b></div><div class="nav">${nav.map(n=>`<button class="${st.route==n[0]?'on':''}" onclick="setRoute('${n[0]}')">${n[1]}</button>`).join('')}</div></aside><main class="main"><div class="top"><div><div class="title">${t}</div><div class="sub">107 cours Notion • ≥727 questions • répétition personnalisée</div></div><span class="badge">🔥 ${st.streak} j</span></div>${x}</main></div>`}function counts(){let td=today();return{today:st.due.filter(x=>x.date===td).length,late:st.due.filter(x=>x.date<td).length,future:st.due.filter(x=>x.date>td).length,all:st.due.length,ignored:st.ignored.length}}function home(){let p=Math.min(100,st.done/target*100),c=counts();return shell(`<div class="kpis"><div class="card kpi"><strong>${st.done}/${target}+</strong><span>Questions uniques</span></div><div class="card kpi"><strong>${st.cov}/${totalCourses}</strong><span>Cours couverts</span></div><div class="card kpi"><strong>${c.today+c.late}</strong><span>À revoir aujourd’hui</span></div><div class="card kpi"><strong>${st.xp}</strong><span>Points de maîtrise</span></div></div><div class="hero"><div class="card mission"><span class="badge">Mission du jour</span><h2>Continuer le parcours</h2><p>Une tâche à la fois, avec choix libre de la prochaine révision après correction.</p><button class="btn" onclick="start()">Continuer</button></div><div class="card"><h3>Progression globale</h3><div class="progress"><div style="width:${p}%"></div></div><p class="muted">${st.today}/${st.goal} nouvelles questions aujourd’hui</p></div></div><div class="grid2" style="margin-top:14px"><div class="card"><h3>Répétition espacée</h3><p><b>${c.today}</b> aujourd’hui • <b>${c.late}</b> en retard • <b>${c.future}</b> à venir</p><button class="btn secondary" onclick="setRoute('reviews')">Voir la file</button></div><div class="card"><h3>Sauvegarde</h3><p class="muted">Réponses et calendrier sont conservés automatiquement sur cet appareil.</p><button class="btn secondary" onclick="exportProgress()">Exporter</button></div></div>`,'Tableau de bord')}function start(){let due=st.due.filter(x=>x.date<=today()).sort((a,b)=>a.date.localeCompare(b.date))[0];if(due)st.current=due.course;else{let n=courses.find(c=>detailed[c[0]]&&!st.hist[c[0]]&&!st.ignored.includes(c[0]));st.current=n?n[0]:'TRUCHETET Marie-Elise Arthrite rcente'}st.route='train';st.sel=null;st.val=false;save();render()}function reviewChoice(){let cur=st.due.find(x=>x.course===st.current);let ignored=st.ignored.includes(st.current);return `<div class="reviewChoice"><b>Quand revoir cette question ?</b><div class="muted" style="font-size:13px;margin-top:3px">Ce choix remplace la programmation précédente pour cette question.</div><div class="reviewBtns">${[[1,'J1'],[2,'J2'],[7,'J7'],[10,'J10']].map(x=>`<button class="${cur&&cur.interval===x[0]?'active':''}" onclick="scheduleReview(${x[0]})">${x[1]}</button>`).join('')}<button class="${ignored?'active':''}" onclick="neverReview()">Ne pas revoir</button></div>${cur?`<div class="muted" style="font-size:13px;margin-top:8px">Prochaine révision : <b>${cur.date}</b> (${cur.label})</div>`:ignored?`<div class="muted" style="font-size:13px;margin-top:8px">Cette question est exclue de la répétition espacée.</div>`:''}</div>`}function train(){let d=detailed[st.current]||detailed['TRUCHETET Marie-Elise Arthrite rcente'],c=courses.find(x=>x[0]==st.current)||courses[0],ok=st.val&&st.sel==d.a;return shell(`<div class="train"><section class="card"><div><span class="badge ${c[2].startsWith('P1')?'p1':c[2].startsWith('P2')?'p2':'p3'}">${c[2]}</span> <span class="badge">QCM</span></div><h2>${d.q}</h2><div class="options">${d.opts.map((o,i)=>`<button class="opt ${st.sel===i?'sel':''}" onclick="sel(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><div><button class="btn primary" onclick="validateQ()">Valider</button> <button class="btn secondary" onclick="dontknow()">Je ne sais pas</button> <button class="btn warn" onclick="hard()">Marquer difficile</button></div>${st.val?`<div class="feedback ${ok?'ok':'ko'}"><b>${ok?'Correct':'À revoir'}</b><br>${d.c}</div>${reviewChoice()}`:''}<details class="de"><summary>🇩🇪 Deutsch</summary><div>${d.de}</div></details></section><aside class="card course"><div class="muted" style="font-size:12px">Cours Notion correspondant</div><h3>${c[0]}</h3><pre>${d.course}</pre><a href="${c[3]}" target="_blank">Ouvrir la fiche Notion ↗</a></aside></div>`,'Entraînement')}function sel(i){if(!st.val){st.sel=i;render()}}function dontknow(){st.sel=-1;validateQ()}function validateQ(){let d=detailed[st.current];if(st.sel===null)return;let first=!st.hist[st.current],ok=st.sel===d.a;st.val=true;st.hist[st.current]=st.hist[st.current]||{a:0,c:0};st.hist[st.current].a++;if(ok)st.hist[st.current].c++;if(first){st.done++;st.cov++;st.today++;st.xp+=ok?20:10}if(!ok&&!st.hard.includes(st.current))st.hard.push(st.current);save();render()}function scheduleReview(days){st.due=st.due.filter(x=>x.course!==st.current);st.ignored=st.ignored.filter(x=>x!==st.current);st.due.push({course:st.current,date:datePlus(days),interval:days,label:'J'+days});save();render()}function neverReview(){st.due=st.due.filter(x=>x.course!==st.current);if(!st.ignored.includes(st.current))st.ignored.push(st.current);save();render()}function hard(){if(!st.hard.includes(st.current))st.hard.push(st.current);save();render()}function path(){return shell(`<div class="path">${courses.map(c=>{let done=!!st.hist[c[0]];return `<div class="card node"><span class="badge ${c[2].startsWith('P1')?'p1':c[2].startsWith('P2')?'p2':'p3'}">${c[2]}</span><h3>${c[0]}</h3><small>${c[1]} • ${done?'Acquis/en cours':'À travailler'}</small></div>`}).join('')}</div>`,'Parcours')}function setReviewFilter(f){st.reviewFilter=f;save();render()}function reviews(){let c=counts(),td=today(),arr=st.due.slice();if(st.reviewFilter==='today')arr=arr.filter(x=>x.date===td);if(st.reviewFilter==='late')arr=arr.filter(x=>x.date<td);if(st.reviewFilter==='future')arr=arr.filter(x=>x.date>td);if(st.reviewFilter==='ignored')arr=[];arr.sort((a,b)=>a.date.localeCompare(b.date));let filters=[['today',`À revoir aujourd’hui (${c.today})`],['late',`En retard (${c.late})`],['future',`À venir (${c.future})`],['all',`Toutes (${c.all})`],['ignored',`Ne pas revoir (${c.ignored})`]];return shell(`<div class="toolbar">${filters.map(x=>`<button class="${st.reviewFilter===x[0]?'on':''}" onclick="setReviewFilter('${x[0]}')">${x[1]}</button>`).join('')}</div><div class="card">${st.reviewFilter==='ignored'?`<table class="table"><thead><tr><th>Question / cours</th><th>Action</th></tr></thead><tbody>${st.ignored.map(x=>`<tr><td>${x}</td><td><button class="btn secondary" onclick="restoreReview('${x.replaceAll("'","\\'")}')">Remettre à J2</button></td></tr>`).join('')||'<tr><td colspan="2" class="muted">Aucune question ignorée.</td></tr>'}</tbody></table>`:`<table class="table"><thead><tr><th>Question / cours</th><th>Échéance</th><th>Intervalle</th><th></th></tr></thead><tbody>${arr.map(x=>`<tr><td>${x.course}</td><td>${x.date}</td><td>${x.label}</td><td>${x.date<=td?`<button class="btn secondary" onclick="openReview('${x.course.replaceAll("'","\\'")}')">Réviser</button>`:'Planifiée'}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Aucune question dans cette catégorie.</td></tr>'}</tbody></table>`}</div>`,'Répétition espacée')}function openReview(course){st.current=course;st.route='train';st.sel=null;st.val=false;save();render()}function restoreReview(course){st.ignored=st.ignored.filter(x=>x!==course);st.due=st.due.filter(x=>x.course!==course);st.due.push({course,date:datePlus(2),interval:2,label:'J2'});save();render()}function stats(){let att=Object.values(st.hist).reduce((s,x)=>s+x.a,0),cor=Object.values(st.hist).reduce((s,x)=>s+x.c,0),rate=att?Math.round(cor/att*100):0,c=counts();return shell(`<div class="kpis"><div class="card kpi"><strong>${st.done}</strong><span>Questions uniques</span></div><div class="card kpi"><strong>${rate}%</strong><span>Réussite</span></div><div class="card kpi"><strong>${st.hard.length}</strong><span>Points faibles</span></div><div class="card kpi"><strong>${c.today+c.late}</strong><span>À revoir aujourd’hui</span></div></div><div class="card" style="margin-top:14px"><h3>Répétition espacée</h3><p>${c.today} aujourd’hui • ${c.late} en retard • ${c.future} à venir • ${c.ignored} exclues.</p><button class="btn secondary" onclick="setRoute('reviews')">Ouvrir la file</button></div><div class="card" style="margin-top:14px"><h3>Transfert de progression</h3><button class="btn secondary" onclick="exportProgress()">Exporter</button> <button class="btn secondary" onclick="importProgress()">Importer</button></div>`,'Statistiques')}function exportProgress(){let b=new Blob([JSON.stringify(st,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='pulse-rhumato-progression.json';a.click()}function importProgress(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=e=>{let r=new FileReader();r.onload=()=>{try{st=JSON.parse(r.result);save();render()}catch{alert('Fichier invalide')}};r.readAsText(e.target.files[0])};i.click()}function render(){let f={home,path,train,reviews,stats}[st.route]||home;document.getElementById('app').innerHTML=f()}render();
